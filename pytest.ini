[pytest]
# ==================== 测试发现规则 ====================
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
pythonpath = .    # 将项目根目录加入 Python 搜索路径，解决 src 模块导入问题


# ==================== 自定义标记（避免运行警告）====================
markers =
    smoke: 冒烟测试，验证核心链路（10分钟内跑完）
    cockpit: 座舱域功能测试（多媒体/语音/车控）
    ai: AI模型测试（需求解析/用例生成）
    bus: 总线通信测试（CAN/LIN/UDS，需要硬件环境）
    slow: 慢速测试，执行时间较长

# ==================== 默认命令行参数 ====================
addopts = -v --tb=short
# 覆盖率配置（需安装 pytest-cov）
# 取消下行注释即可启用覆盖率门槛（例如要求 >= 80%）
# addopts = -v --tb=short --cov=src --cov-fail-under=80

# ==================== 日志配置 ====================
# --- 控制台日志（开发调试用）---
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)s] %(name)s: %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

# --- 文件日志（CI/CD 和事后排查用）---
log_file = logs/pytest.log
log_file_level = DEBUG
log_file_format = %(asctime)s [%(levelname)s] %(filename)s:%(lineno)d %(name)s: %(message)s
log_file_date_format = %Y-%m-%d %H:%M:%S

# --- 全局日志级别 ---
log_level = INFO
